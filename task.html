<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<title>משימה משותפת</title>
<style>
:root{color-scheme:dark light;--bg:#0f1420;--card:#192033;--tx:#f2f5fb;--mu:#b9c3d8;--ac:#7cc4ff;--ok:#7be0a4;--wn:#ffd37a;--bd:#33405c}
@media(prefers-color-scheme:light){:root{--bg:#f3f6fb;--card:#fff;--tx:#10182b;--mu:#46526b;--ac:#0b57b7;--ok:#0b7a3e;--wn:#8a5a00;--bd:#c5cfe2}}
*{box-sizing:border-box}body{margin:0;font:17px/1.55 system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);padding:16px}
main{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
h1{font-size:22px;margin:.2em 0}.ev{color:var(--ac);font-weight:700;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{border:1px solid var(--bd);border-radius:999px;padding:3px 12px;font-size:14px;color:var(--mu)}
.notes{white-space:pre-wrap;margin-top:12px}
.note{font-size:14px;color:var(--mu)}
.notes,.card h1{overflow-wrap:anywhere;word-break:break-word}
.il{color:var(--ac);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.lk{display:flex;align-items:center;gap:12px;padding:13px 15px;margin-top:10px;border:1px solid var(--bd);border-radius:14px;text-decoration:none;color:var(--tx);background:rgba(127,127,127,.08);min-height:52px}
.lk:active{background:rgba(127,127,127,.2)}.lk .ic{font-size:22px}.lk .tx{flex:1;min-width:0}.lk b{display:block;overflow-wrap:anywhere}.lk small{display:block;color:var(--mu);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk.lock{border-style:dashed;color:var(--mu)}
button,input,textarea{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:12px;padding:10px 14px;min-height:44px}
button{cursor:pointer;background:var(--ac);color:#04101f;border-color:var(--ac);font-weight:700}button.s{background:transparent;color:var(--tx);border-color:var(--bd)}
input,textarea{width:100%}textarea{min-height:90px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ok{color:var(--ok)}.bad{color:var(--wn)}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okObj=o=>o&&o.v===1&&typeof o.t==='string';
function decB64(s){let b=s.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return JSON.parse(decodeURIComponent(escape(atob(b))))}
let cam=null;
function stopCam(){if(cam){cam.getTracks().forEach(t=>t.stop());cam=null}}
function home(msg){stopCam();document.title='משימה משותפת';
  app.innerHTML=`<div class="card"><h1>פתיחת משימה</h1><div class="note">יש לך קישור או כתובת קצרה? הדבק או הקלד כאן. אפשר גם לסרוק QR.</div>
  <div class="row"><input id="ad" dir="ltr" placeholder="קישור, או קוד קצר כמו ab12cd" autocapitalize="off" autocomplete="off"></div>
  <div class="row"><button id="op">פתח</button><button class="s" id="sc">📷 סרוק QR</button></div>
  <div id="hm" class="note">${msg?'<span class="bad">'+esc(msg)+'</span>':''}</div><video id="vd" playsinline muted style="display:none;width:100%;border-radius:12px;margin-top:10px"></video></div>`;
  $('#op').onclick=()=>openAny($('#ad').value.trim());
  $('#ad').onkeydown=e=>{if(e.key==='Enter')openAny($('#ad').value.trim())};
  $('#sc').onclick=scan}
function openAny(v){if(!v)return;
  let m=v.match(/#(d|c)=([A-Za-z0-9_-]+)/);
  if(m){try{const u=new URL(v);if(u.origin!==location.origin){location.href=v;return}}catch(e){}
    location.hash=m[1]+'='+m[2];route();return}
  const c=v.replace(/[^A-Za-z0-9_-]/g,'').slice(0,40);
  if(c.length<3){$('#hm').innerHTML='<span class="bad">כתובת לא תקינה</span>';return}
  location.hash='c='+c;route()}
async function scan(){const hm=$('#hm');
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices){hm.innerHTML='<span class="bad">הסריקה בתוך הדף לא נתמכת בדפדפן הזה. סרוק עם מצלמת הטלפון, והקישור יפתח כאן.</span>';return}
  try{cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}catch(e){hm.innerHTML='<span class="bad">אין הרשאה למצלמה</span>';return}
  const v=$('#vd');v.style.display='block';v.srcObject=cam;await v.play();hm.textContent='כוון את המצלמה אל קוד ה-QR';
  const det=new BarcodeDetector({formats:['qr_code']});
  const tick=async()=>{if(!cam)return;try{const r=await det.detect(v);if(r.length){const t=r[0].rawValue;stopCam();v.style.display='none';
      if(/#(d|c)=/.test(t)||/^[A-Za-z0-9_-]{3,40}$/.test(t)){openAny(t);return}hm.innerHTML='<span class="bad">ה-QR אינו קישור למשימה</span>';return}}catch(e){}
    requestAnimationFrame(tick)};tick()}
async function route(){stopCam();const hs=location.hash;let m;
  if(m=hs.match(/^#d=([A-Za-z0-9_-]+)$/)){let D=null;try{D=decB64(m[1])}catch(e){}if(okObj(D))return show(D,'link');return home('הקישור לא תקין')}
  if(m=hs.match(/^#c=([A-Za-z0-9_-]{3,40})$/)){app.innerHTML='<div class="card"><div class="note">⏳ בודק את הכתובת...</div></div>';
    try{const r=await fetch('t/'+m[1].toLowerCase()+'.json',{cache:'no-store',credentials:'omit'});if(!r.ok)throw 0;const D=await r.json();if(okObj(D))return show(D,'code')}catch(e){}
    return home('לא נמצאה משימה ציבורית בכתובת הזו')}
  home()}
const PRI={1:'דחוף',2:'רגיל',3:'נמוך'};
const URLRE=/(https?:\/\/[^\s<>"']+)/g;
function safeUrl(u){try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch(e){return null}}
function linkify(t){return String(t).split(URLRE).map((s,i)=>{if(i%2===0)return esc(s);const m=s.match(/[.,;:!?)\]]+$/),tail=m?m[0]:'',u=tail?s.slice(0,-tail.length):s,ok=safeUrl(u);return ok?`<a class="il" href="${esc(ok)}" target="_blank" rel="noopener noreferrer">${esc(u.replace(/^https?:\/\//,''))}</a>${esc(tail)}`:esc(s)}).join('')}
function icon(u){const h=new URL(u).hostname;return /youtu/.test(h)?'▶️':/drive\.google|docs\.google/.test(h)?'📄':/wa\.me|whatsapp/.test(h)?'💬':/t\.me|telegram/.test(h)?'✈️':/zoom|meet\.google/.test(h)?'🎥':'🔗'}
function lkBtn(t,u){const ok=safeUrl(u);if(!ok)return '';const x=new URL(ok);return `<a class="lk" href="${esc(ok)}" target="_blank" rel="noopener noreferrer"><span class="ic">${icon(ok)}</span><span class="tx"><b>${esc(t||x.hostname)}</b><small>${esc(x.hostname+(x.pathname.length>1?x.pathname:''))}</small></span><span>↗</span></a>`}
const b64d=s=>{let b=s.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return Uint8Array.from(atob(b),c=>c.charCodeAt(0))};
async function decLink(e,code){const enc=new TextEncoder(),km=await crypto.subtle.importKey('raw',enc.encode(code.toUpperCase()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(e.s),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.i)},key,b64d(e.c)))}
function linksHtml(D){const L=Array.isArray(D.l)?D.l.slice(0,8):[];if(!L.length)return '';
  const pub=L.filter(l=>l&&l.u).map(l=>lkBtn(l.t,l.u)).join(''),prv=L.filter(l=>l&&l.e);
  return `<div class="card"><b>קישורים</b>${pub}<div id="pv">${prv.length?`<div class="lk lock"><span class="ic">🔒</span><span class="tx"><b>${prv.length} קישורים פרטיים</b><small style="direction:rtl;text-align:right">נפתחים עם קוד מהמנהל</small></span></div><div class="row"><input id="pcd" placeholder="קוד" dir="ltr" autocomplete="off" autocapitalize="characters"><button id="pgo" class="s">פתח</button></div><div id="pms" class="note"></div>`:''}</div></div>`}
function bindLinks(D){const b=$('#pgo');if(!b)return;const prv=D.l.filter(l=>l&&l.e);
  b.onclick=async()=>{const c=$('#pcd').value.trim();if(!c)return;let out='',n=0;
    for(const l of prv){try{const u=await decLink(l.e,c);out+=lkBtn(l.t,u);n++}catch(e){}}
    if(n){$('#pv').innerHTML=out+(n<prv.length?'<div class="note">חלק מהקישורים לא נפתחו</div>':'')}else $('#pms').innerHTML='<span class="bad">הקוד לא נכון</span>'};
  $('#pcd').onkeydown=e=>{if(e.key==='Enter')b.onclick()}}
function show(D,how){document.title=D.t;
  let chips='<span class="chip ok">🌐 ציבורית</span>';
  if(D.p)chips+=`<span class="chip">עדיפות: ${PRI[D.p]||''}</span>`;
  if(D.du)chips+=`<span class="chip">📅 ${esc(D.du)}</span>`;
  if(D.tu)chips+=`<span class="chip">⏱ עד ${esc(String(D.tu).replace('T',' '))}</span>`;
  const can=(D.wa||D.em||D.tg)&&D.h;
  chips+=can?'<span class="chip">💬 אפשר להשתתף באישור המנהל</span>':'<span class="chip">👁 לצפייה בלבד</span>';
  app.innerHTML=`<div class="card">${D.ev?`<div class="ev">${esc(D.ev)}</div>`:''}<h1>${esc(D.t)}</h1><div class="meta">${chips}</div>${D.n?`<div class="notes">${linkify(D.n)}</div>`:''}
  <div class="note" style="margin-top:14px">תצוגה בלבד. הדף לא שומר מידע ולא שולח אותו לשום שרת.${D.ai?' התוכן נוצר בעזרת בינה מלאכותית.':''}</div><div class="row"><button class="s" id="hb">פתח משימה אחרת</button></div></div>${linksHtml(D)}<div class="card" id="cm"></div>`;
  bindLinks(D);
  $('#hb').onclick=()=>{history.replaceState(null,'',location.pathname);home()};
  gate(D)}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function gate(D){const cm=$('#cm');
  const send=text=>{const e=encodeURIComponent(text);
    const wa=D.wa?`<a href="https://wa.me/${esc(D.wa)}?text=${e}"><button type="button">וואטסאפ</button></a>`:'';
    const tg=D.tg?`<a href="https://t.me/${esc(D.tg)}?text=${e}"><button type="button">טלגרם</button></a>`:'';
    const em=D.em?`<a href="mailto:${esc(D.em)}?subject=${encodeURIComponent('משימה: '+D.t)}&body=${e}"><button type="button">מייל</button></a>`:'';
    $('#msg').innerHTML=`<div class="row">${wa}${tg}${em}</div><div class="note">בחר איך לשלוח. ההודעה נשלחת ישירות למנהל, לא נשמרת בדף.</div>`};
  if(!((D.wa||D.em||D.tg)&&D.h)){cm.innerHTML='<b>תגובות</b><div class="note">למשימה הזו לא הוגדרה אפשרות תגובה.</div>';return}
  cm.innerHTML=`<b>רוצה להשתתף?</b><div class="note">כדי להגיב נדרש אישור ממנהל האירוע. בקש אישור, וקבל ממנו קוד.</div>
  <div class="row"><input id="nm" placeholder="השם שלך" maxlength="40"></div><div class="row"><button id="rq">בקש אישור להגיב</button></div>
  <div class="row"><input id="cd" placeholder="קוד אישור" dir="ltr" autocomplete="off"><button class="s" id="go">פתח</button></div><div id="msg" class="note"></div>`;
  $('#rq').onclick=()=>{const nm=$('#nm').value.trim();if(!nm){$('#msg').innerHTML='<span class="bad">כתוב את שמך קודם</span>';return}send(`שלום, אני ${nm}. אשמח לקבל אישור להגיב על המשימה: ${D.t}`)};
  $('#go').onclick=async()=>{const c=$('#cd').value.trim(),nm=$('#nm').value.trim();if(!(c&&await sha(c.toUpperCase())===D.h)){$('#msg').innerHTML='<span class="bad">הקוד לא נכון</span>';return}
    cm.innerHTML=`<b class="ok">אושרת להגיב ✓</b><div class="row"><textarea id="tx" maxlength="1000" placeholder="התגובה שלך"></textarea></div><div class="row"><button id="sd">שלח למנהל</button></div><div id="msg"></div>`;
    $('#sd').onclick=()=>{const t=$('#tx').value.trim();if(t)send(`תגובה על "${D.t}"${nm?' מאת '+nm:''}:\n${t}`)}}}
addEventListener('hashchange',route);route();
})();
</script>
</body>
</html>
